// Contrato del servicio, semana 11. Dominio de mensajería instantánea
// del equipo SD-Jaune-Asencio (las operaciones de semana10/rpc.py).
//
// Reglas del contrato
//  1. Cada campo tiene un número. Ese número es lo que viaja por la red,
//     no el nombre. Un número usado no se reutiliza nunca.
//  2. Las operaciones que modifican estado llevan id_solicitud, la clave que
//     permite al servidor reconocer un reintento (semántica at-most-once).
//  3. Para agregar un campo nuevo se usa un número nuevo. Para eliminar uno
//     se marca como reserved.

syntax = "proto3";

package mensajeria.v1;

service Mensajeria {
  // Solo lectura, idempotente, se puede reintentar sin miedo
  rpc Usuarios (UsuariosSolicitud) returns (UsuariosRespuesta);

  // Modifican estado, NO idempotentes, necesitan id_solicitud
  rpc Enviar    (EnviarSolicitud)    returns (EnviarRespuesta);
  rpc Leer      (LeerSolicitud)      returns (LeerRespuesta);

  // Operación nueva del trabajo autónomo. Crea un usuario.
  // Modifica estado y NO es idempotente: el segundo alta del mismo
  // nombre falla con USUARIO_EXISTE. Por eso también lleva id_solicitud.
  rpc Registrar (RegistrarSolicitud) returns (RegistrarRespuesta);
}

message UsuariosSolicitud {}

message Usuario {
  string nombre     = 1;
  int32  pendientes = 2;
}

message UsuariosRespuesta {
  repeated Usuario usuarios = 1;
}

message EnviarSolicitud {
  string id_solicitud = 1;   // lo genera el cliente, se repite igual en cada reintento
  string origen       = 2;
  string destino      = 3;
  string texto        = 4;
}

message EnviarRespuesta {
  string destino    = 1;
  int32  pendientes = 2;
}

message LeerSolicitud {
  string id_solicitud = 1;
  string usuario      = 2;
  int32  cantidad     = 3;
}

message LeerRespuesta {
  string usuario      = 1;
  int32  pendientes   = 2;
  repeated string mensajes = 3;
}

message RegistrarSolicitud {
  string id_solicitud = 1;
  string usuario      = 2;
}

message RegistrarRespuesta {
  string usuario    = 1;
  int32  pendientes = 2;
}
