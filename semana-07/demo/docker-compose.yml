# Semana 7  demo del jueves. Tres niveles en la red sd_net.
#
#   cliente / navegador  ->  nginx (80)  ->  api1, api2 (8000)  ->  servidor (5000)
#        HTTP                    HTTP              TCP, protocolo de texto
#
#   Levantar              docker compose up -d --build
#   Demo 1, estado local  ESTADO=local docker compose up -d --force-recreate api1 api2
#   Volver a 3 niveles    ESTADO=servidor docker compose up -d --force-recreate api1 api2
#   PowerShell            $env:ESTADO="local"; docker compose up -d --force-recreate api1 api2
#   Desde el navegador    http://localhost:8080/items   y   http://localhost:8080/docs
services:
  servidor:
    build: .
    container_name: sd_servidor
    command: python servidor.py
    environment:
      - PUERTO=5000
      - TIMEOUT_CLIENTE=60
    networks:
      - sd_net

  api1:
    build: .
    container_name: sd_api1
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      - REPLICA=api1
      - ESTADO=${ESTADO:-servidor}
      - SERVIDOR_HOST=servidor
      - SERVIDOR_PUERTO=5000
    networks:
      - sd_net
    depends_on:
      - servidor

  api2:
    build: .
    container_name: sd_api2
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      - REPLICA=api2
      - ESTADO=${ESTADO:-servidor}
      - SERVIDOR_HOST=servidor
      - SERVIDOR_PUERTO=5000
    networks:
      - sd_net
    depends_on:
      - servidor

  nginx:
    image: nginx:1.27-alpine
    container_name: sd_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - sd_net
    depends_on:
      - api1
      - api2

  cliente:
    build: .
    container_name: sd_cliente
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      - API_URL=http://nginx
      - SERVIDOR_HOST=servidor
      - SERVIDOR_PUERTO=5000
    networks:
      - sd_net
    depends_on:
      - nginx

networks:
  sd_net:
    name: sd_net
