# Configuracion principal de Nginx y balanceador de carga de la Semana 7.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream api {
        # Si una replica falla, Nginx la evita por 10 segundos.
        server api1:8000 max_fails=1 fail_timeout=10s;
        server api2:8000 max_fails=1 fail_timeout=10s;
        server api3:9000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Atendido-Por $upstream_addr always;
        }
    }
}
